<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Music Player</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<div class="app-shell">
			<header class="app-header">
				<h1>Music Player</h1>
				<button class="theme-toggle" type="button">
					<span class="toggle-knob"></span>
					<span class="toggle-text">Dark</span>
				</button>
			</header>

			<main class="player-grid">
				<section class="panel songs-panel">
					<div class="panel-top">
						<label for="genre-select">Filter by Genre:</label>
						<select id="genre-select">
							<option class="selectedGenre">All</option>
							<option>Pop</option>
							<option>Rock</option>
							<option>Jazz</option>
							<option>Hip-Hop</option>
						</select>
					</div>
					<h2>All Songs</h2>
					<div class="song-list">
						<!-- <button type="button">Shape Of You - Ed Sheeran</button>
						<button type="button">Skyfall - Adele</button>
						<button type="button">Somelike Like You - Adele</button>
						<button type="button">Wonderwall - Oasis</button>
						<button type="button">Sugar - Maroon 5</button>
						<button type="button">Locked Away - R. City</button> -->
					</div>
				</section>

				<section class="panel player-card">
					<div class="card-wrapper">
						<div class="cover-card">
							<div class="cover-frame">
								<div class="cover-image"></div>
							</div>
						</div>
						<div class="current-track">
							<p class="track-title">Shape Of You</p>
							<p class="track-artist">Ed Sheeran</p>
						</div>
						<div class="audio-visualizer">
							<div class="media-bar"></div>
						</div>
						<div class="player-controls">
							<button type="button" class="control-btn">Prev</button>
							<button type="button" class="control-btn play-btn">Play</button>
							<button type="button" class="control-btn">Next</button>
						</div>
						<button type="button" class="playlist-btn">Add to Playlist</button>
					</div>
				</section>

				<section class="panel playlist-panel">
					<div class="playlist-top">
						<input
							type="text"
							placeholder="Enter playlist name"
							aria-label="Playlist name"
						/>
						<button type="button">Create Playlist</button>
					</div>
					<div class="playlist-content">
						<h2>Current Playlist</h2>
						<div class="current-playlist">
							<p>No playlist selected</p>
						</div>
						<h2>All Playlists</h2>
						<div class="playlist-list">
							<button type="button">Chill Vibes</button>
							<button type="button">Workout</button>
							<button type="button">Favorites</button>
						</div>
					</div>
				</section>
			</main>
		</div>
		<script src="theme-toggle.js"></script>
		<script src="script.js"></script>
	</body>
</html>
